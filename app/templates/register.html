{% extends "base.html" %}{% block title %}Create account — NeoGuard{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="eyebrow">CLINICIAN ACCOUNT</div><h1>Create your workspace</h1><p>Use a strong password. Production deployments should add MFA and an organization identity provider.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="10" required></label><button class="primary full">Create account</button></form><p class="center">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></div>{% endblock %}
