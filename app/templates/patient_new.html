{% extends "base.html" %}{% block title %}New patient — NeoGuard{% endblock %}
{% block content %}
<div class="form-page"><div class="eyebrow">STEP 1 · PATIENT PROFILE</div><h1>Create patient record</h1><p class="lead">Use a local patient code in clinical environments. This prototype stores data locally in SQLite.</p>
<form method="post" class="panel form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Patient name<input name="name" required></label><label>Date of birth<input name="dob" type="date"></label>
<label>Gestational age (weeks)<input name="gestational_age" type="number" step=".1" min="20" max="45" required></label><label>Birth weight (kg)<input name="birth_weight" type="number" step=".01" min=".2" max="7" required></label>
<label>Sex<select name="sex"><option>Female</option><option>Male</option><option>Intersex/unspecified</option></select></label>
<label>Delivery mode<select name="delivery_mode"><option>Vaginal</option><option>Caesarean</option><option>Assisted</option><option>Unknown</option></select></label>
<label>APGAR 1 min<input name="apgar_1" type="number" min="0" max="10"></label><label>APGAR 5 min<input name="apgar_5" type="number" min="0" max="10"></label>
<div class="form-actions"><button class="primary">Create & continue →</button></div></form></div>
{% endblock %}
